<!doctype html>
<meta charset="utf-8">
<title>Gesture Cam photo test</title>
<script type="module">
// Runs the hand tracker on the photos in test/images and checks each hand's gesture.
// photos.mjs opens this. You can also open it yourself when adjusting the gesture rules.
import factory from "../extension/vendor/mediapipe/vision_wasm_module_internal.js";
import { HandLandmarker } from "../extension/vendor/mediapipe/vision_bundle.mjs";
import { bothHandsUp, classify, measure } from "../extension/content/gestures.js";

const PHOTOS = ["thumb_up", "pointing_up", "pointing_up_rotated", "victory", "fist", "right_hands"];

globalThis.ModuleFactory = factory;
const hands = await HandLandmarker.createFromOptions(
  { wasmLoaderPath: "", wasmBinaryPath: "../extension/vendor/mediapipe/vision_wasm_module_internal.wasm" },
  { baseOptions: { modelAssetPath: "../extension/models/hand_landmarker.task", delegate: "CPU" }, runningMode: "IMAGE", numHands: 2 },
);

const results = {};
// Remember which hand ("Left" or "Right") each detected hand is. Palm up vs down needs it.
const handOf = new WeakMap();
const detectHands = (img) => {
  const r = hands.detect(img);
  r.landmarks.forEach((lm, i) => handOf.set(lm, r.handedness[i][0].categoryName));
  return r.landmarks;
};
for (const name of PHOTOS) {
  const img = new Image();
  img.src = `images/${name}.jpg`;
  await img.decode();
  const found = detectHands(img);
  results[name] = found.map((lm) => {
    const m = measure(lm, img.naturalWidth, img.naturalHeight, handOf.get(lm));
    return {
      gesture: classify(lm, img.naturalWidth, img.naturalHeight, handOf.get(lm))?.name ?? null,
      fingers: Object.fromEntries(Object.entries(m.fingers).map(([k, f]) => [k, f.extended ? "out" : f.curled ? "curled" : "?"])),
      thumb: { out: m.thumbOut, straight: +m.thumbStraight.toFixed(2), gap: +m.thumbGap.toFixed(2), dirY: +m.thumbDir[1].toFixed(2) },
      handDirY: +m.handDir[1].toFixed(2),
      palmFacingY: +m.palmFacing[1].toFixed(2),  // close to 1 or -1 means the hand is flat
    };
  });
}
// Made-up poses from real hands, for poses I don't have photos of.
const W = {}, H = {};  // photo sizes
for (const name of PHOTOS) { const i = new Image(); i.src = `images/${name}.jpg`; await i.decode(); W[name] = i.naturalWidth; H[name] = i.naturalHeight; }
const handFrom = async (photo, gesture) => {
  const img = new Image(); img.src = `images/${photo}.jpg`; await img.decode();
  return detectHands(img).find((lm) => classify(lm, W[photo], H[photo], handOf.get(lm))?.name === gesture);
};
// Turn a hand around its wrist. "x" tips it forward or back, "z" turns it sideways.
const rotate = (lm, photo, axis, degrees) => {
  const w = W[photo], h = H[photo], a = (degrees * Math.PI) / 180, c = Math.cos(a), s = Math.sin(a);
  const o = [lm[0].x * w, lm[0].y * h, lm[0].z * w];
  return lm.map((q) => {
    let [x, y, z] = [q.x * w - o[0], q.y * h - o[1], q.z * w - o[2]];
    if (axis === "x") [y, z] = [y * c - z * s, y * s + z * c];
    else [x, y] = [x * c - y * s, x * s + y * c];
    return { x: (x + o[0]) / w, y: (y + o[1]) / h, z: (z + o[2]) / w };
  });
};
// Swap the shapes of two fingers.
const swapFingers = (lm, a, b) => {
  const out = lm.map((q) => ({ ...q }));
  for (let j = 1; j < 4; j++) {
    for (const [from, to] of [[a, b], [b, a]]) {
      out[to + j] = { x: lm[from + j].x - lm[from].x + lm[to].x, y: lm[from + j].y - lm[from].y + lm[to].y, z: lm[from + j].z - lm[from].z + lm[to].z };
    }
  }
  return out;
};
const palm = await handFrom("right_hands", "openPalm");
const pointing = await handFrom("pointing_up", "indexPoint");
const variants = {
  // The photo shows the back of the hand, so tipping it back 80 degrees turns the palm up.
  "open hand tilted flat, palm up": ["right_hands", rotate(palm, "right_hands", "x", 80)],
  "open hand tilted flat, palm down": ["right_hands", rotate(palm, "right_hands", "x", -80)],
  "open hand turned sideways": ["right_hands", rotate(palm, "right_hands", "z", 90)],
  "middle finger instead of index": ["pointing_up", swapFingers(pointing, 5, 9)],
};
for (const [name, [photo, lm]] of Object.entries(variants)) {
  const hand = handOf.get(palm);  // all the made-up hands come from right hands
  results[name] = [{ gesture: classify(lm, W[photo], H[photo], hand)?.name ?? null, palmUpY: +(measure(lm, W[photo], H[photo], hand).palmDir?.[1] ?? 0).toFixed(2) }];
}
// Two-hand gestures look at both hands together.
const shift = (lm, dx) => lm.map((q) => ({ ...q, x: q.x + dx }));
const bothPhoto = new Image(); bothPhoto.src = "images/right_hands.jpg"; await bothPhoto.decode();
const pair = (hands) => [{ gesture: bothHandsUp(hands, W.right_hands, H.right_hands)?.name ?? null }];
const fistPhoto = new Image(); fistPhoto.src = "images/fist.jpg"; await fistPhoto.decode();
const fist = detectHands(fistPhoto)[0];
results["both hands: real photo, one upside down"] = pair(detectHands(bothPhoto));
results["both hands: two open hands up"] = pair([palm, shift(palm, -0.3)]);
results["both hands: one open hand up"] = pair([palm]);
results["both hands: open hand + fist"] = pair([palm, fist]);
window.results = results;
document.body.textContent = JSON.stringify(results, null, 1);
</script>
