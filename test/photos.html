<!doctype html>
<meta charset="utf-8">
<title>Gesture Cam photo test</title>
<script type="module">
// Runs the real hand tracker on the photos in test/images and classifies each hand.
// Opened by test/photos.mjs; also handy to open by hand while tuning thresholds.
import factory from "../extension/vendor/mediapipe/vision_wasm_module_internal.js";
import { HandLandmarker } from "../extension/vendor/mediapipe/vision_bundle.mjs";
import { classify, measure } from "../extension/content/gestures.js";

const PHOTOS = ["thumb_up", "pointing_up", "pointing_up_rotated", "victory", "fist", "right_hands"];

globalThis.ModuleFactory = factory;
const hands = await HandLandmarker.createFromOptions(
  { wasmLoaderPath: "", wasmBinaryPath: "../extension/vendor/mediapipe/vision_wasm_module_internal.wasm" },
  { baseOptions: { modelAssetPath: "../extension/models/hand_landmarker.task", delegate: "CPU" }, runningMode: "IMAGE", numHands: 2 },
);

const results = {};
for (const name of PHOTOS) {
  const img = new Image();
  img.src = `images/${name}.jpg`;
  await img.decode();
  const found = hands.detect(img).landmarks;
  results[name] = found.map((lm) => {
    const m = measure(lm, img.naturalWidth, img.naturalHeight);
    return {
      gesture: classify(lm, img.naturalWidth, img.naturalHeight)?.name ?? null,
      fingers: Object.fromEntries(Object.entries(m.fingers).map(([k, f]) => [k, f.extended ? "out" : f.curled ? "curled" : "?"])),
      thumb: { out: m.thumbOut, straight: +m.thumbStraight.toFixed(2), gap: +m.thumbGap.toFixed(2), dirY: +m.thumbDir[1].toFixed(2) },
      handDirY: +m.handDir[1].toFixed(2),
      palmFacingY: +m.palmFacing[1].toFixed(2),  // near ±1 means the hand lies flat
    };
  });
}
// Made-up variants of real hands, for poses no photo shows. Each is a real hand moved in 3D.
const W = {}, H = {};  // photo sizes, to turn normalized points into pixels and back
for (const name of PHOTOS) { const i = new Image(); i.src = `images/${name}.jpg`; await i.decode(); W[name] = i.naturalWidth; H[name] = i.naturalHeight; }
const handFrom = async (photo, gesture) => {
  const img = new Image(); img.src = `images/${photo}.jpg`; await img.decode();
  return hands.detect(img).landmarks.find((lm) => classify(lm, W[photo], H[photo])?.name === gesture);
};
// Rotate a hand about its wrist. axis "x" tips it forward/back; "z" turns it in the picture's plane.
const rotate = (lm, photo, axis, degrees) => {
  const w = W[photo], h = H[photo], a = (degrees * Math.PI) / 180, c = Math.cos(a), s = Math.sin(a);
  const o = [lm[0].x * w, lm[0].y * h, lm[0].z * w];
  return lm.map((q) => {
    let [x, y, z] = [q.x * w - o[0], q.y * h - o[1], q.z * w - o[2]];
    if (axis === "x") [y, z] = [y * c - z * s, y * s + z * c];
    else [x, y] = [x * c - y * s, x * s + y * c];
    return { x: (x + o[0]) / w, y: (y + o[1]) / h, z: (z + o[2]) / w };
  });
};
// Swap two fingers' shapes, keeping each on its own knuckle.
const swapFingers = (lm, a, b) => {
  const out = lm.map((q) => ({ ...q }));
  for (let j = 1; j < 4; j++) {
    for (const [from, to] of [[a, b], [b, a]]) {
      out[to + j] = { x: lm[from + j].x - lm[from].x + lm[to].x, y: lm[from + j].y - lm[from].y + lm[to].y, z: lm[from + j].z - lm[from].z + lm[to].z };
    }
  }
  return out;
};
const palm = await handFrom("right_hands", "openPalm");
const pointing = await handFrom("pointing_up", "indexPoint");
const variants = {
  "open hand tilted flat": ["right_hands", rotate(palm, "right_hands", "x", 80)],
  "open hand tilted flat the other way": ["right_hands", rotate(palm, "right_hands", "x", -80)],
  "open hand turned sideways": ["right_hands", rotate(palm, "right_hands", "z", 90)],
  "middle finger instead of index": ["pointing_up", swapFingers(pointing, 5, 9)],
};
for (const [name, [photo, lm]] of Object.entries(variants)) {
  results[name] = [{ gesture: classify(lm, W[photo], H[photo])?.name ?? null, palmFacingY: +measure(lm, W[photo], H[photo]).palmFacing[1].toFixed(2) }];
}
window.results = results;
document.body.textContent = JSON.stringify(results, null, 1);
</script>
